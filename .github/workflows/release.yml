name: Release

# Builds the installers for every platform and attaches them to a GitHub
# release. Triggered by a version tag, or by hand from the Actions tab.
#
# The macOS job is the only place a DMG can be produced. A disk image needs
# hdiutil and the macOS bundler, both of which exist only on macOS, so this
# job cannot be replaced by a cross build from Linux.

on:
  push:
    # Three ways in, all ending at the same place. A tag is the normal one.
    # A release/v* branch exists for environments that cannot push tags, which
    # is more common than it sounds: many proxies and tokens allow branch
    # updates but refuse tag refs.
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version fuer die Veroeffentlichung, zum Beispiel 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version bestimmen
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          case "${{ github.ref_type }}:${{ github.ref_name }}" in
            tag:*)              TAG="${{ github.ref_name }}" ;;
            branch:release/v*)  TAG="${GITHUB_REF_NAME#release/}" ;;
            *)                  TAG="v${{ inputs.version }}" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Veroeffentlichung als $TAG"

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
            label: macOS, DMG
            # One disk image that runs on Apple silicon and on Intel.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            pdfium: macos-universal
            bundles: dmg
          - os: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
            label: Windows, MSI und NSIS
            target: ""
            rust_targets: ""
            pdfium: windows-x64
            bundles: msi,nsis
          - os: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
            label: Linux, AppImage und DEB
            target: ""
            rust_targets: ""
            pdfium: linux-x64
            bundles: appimage,deb

    steps:
      # First step on purpose. A Mac that goes idle mid build stops talking to
      # GitHub, and after ten minutes of silence GitHub cancels the job. The
      # build itself carries on locally and only learns of the cancellation
      # when the machine comes back, which is why the logs end mid compile with
      # nothing but "The operation was canceled".
      #
      # `-w $PPID` ties the assertion to the runner process, so it ends when
      # the job ends, however it ends.
      #
      # This only covers the build itself. A Mac idling between jobs can still
      # fall asleep and drop off, which leaves jobs queued forever, so the
      # machine has to be kept awake too. See scripts/runner/setup-macos.sh.
      - name: Den Mac wach halten, solange er baut
        if: matrix.pdfium == 'macos-universal'
        run: |
          # -u would cap the assertion at five seconds, which is exactly what
          # happened. -w keeps it alive for the whole job instead. Redirecting
          # the output lets the step finish at once, otherwise it waits for the
          # pipes to close, which means waiting for caffeinate itself.
          nohup caffeinate -dims -w $PPID >/dev/null 2>&1 &

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.label }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Systemabhaengigkeiten, nur Linux
        if: matrix.pdfium == 'linux-x64' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev xdg-utils

      - run: npm ci

      - name: PDFium laden
        run: node scripts/fetch-pdfium.mjs ${{ matrix.pdfium }}

      # bundle_dmg.sh haengt ein Volume ein und wieder aus. Bleibt eines von
      # einem frueheren Lauf stehen, scheitert der naechste beim Einhaengen,
      # nach etwa zwei Minuten Wiederholungen und ohne verwertbare Meldung.
      # Auf einem eigenen Rechner ueberlebt so ein Rest den Lauf, anders als
      # auf einer Wegwerfmaschine.
      - name: Stehengebliebene NPDF-Volumes loesen
        if: matrix.pdfium == 'macos-universal'
        run: |
          for volume in /Volumes/NPDF*; do
            [ -d "$volume" ] || continue
            echo "Loese $volume"
            hdiutil detach "$volume" -force || true
          done

      # Two steps, never both. The signing variables must not merely be empty
      # when there is nothing to sign with, they must be absent: Tauri reads
      # them with std::env::var, which answers Ok("") for a variable that is
      # set but empty, so an empty secret still counts as present and the
      # bundler tries to import a certificate that is not there.
      - name: Bauen und paketieren
        if: vars.ENABLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "NPDF ${{ needs.version.outputs.tag }}"
          releaseBody: |
            Automatisch gebaut. Die Dateien sind noch nicht signiert, siehe docs/platforms.md.

            - macOS: die DMG oeffnen, NPDF in den Programme-Ordner ziehen. Beim
              ersten Start meldet sich Gatekeeper, weil kein Zertifikat vorliegt.
              Rechtsklick auf NPDF, dann Oeffnen.
            - Windows: MSI oder der NSIS-Installer. SmartScreen warnt aus
              demselben Grund.
            - Linux: AppImage ausfuehrbar machen und starten, oder das DEB
              installieren.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} --bundles {1} --verbose', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}

      - name: Bauen, paketieren und signieren
        if: vars.ENABLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "NPDF ${{ needs.version.outputs.tag }}"
          releaseBody: |
            Automatisch gebaut und signiert.

            - macOS: die DMG oeffnen und NPDF in den Programme-Ordner ziehen.
            - Windows: MSI oder der NSIS-Installer.
            - Linux: AppImage ausfuehrbar machen und starten, oder das DEB
              installieren.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} --bundles {1} --verbose', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}


      # A second copy as a workflow artefact, so the files can be downloaded
      # even while the release is still a draft.
      - uses: actions/upload-artifact@v4
        with:
          name: npdf-${{ matrix.pdfium }}
          path: |
            target/release/bundle/**/*
            target/universal-apple-darwin/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
