[workspace]
resolver = "2"
members = ["crates/npdf-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Canoelitose/NPDF"
authors = ["NPDF contributors"]

[workspace.dependencies]
npdf-core = { path = "crates/npdf-core" }

lopdf = { version = "0.44", default-features = false, features = ["chrono"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
rustybuzz = "0.20"
subsetter = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Debug builds of the core are still used for large PDFs during development,
# so keep dependencies optimised even in dev.
[profile.dev.package."*"]
opt-level = 2
